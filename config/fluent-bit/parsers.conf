# =============================================================================
# Fluent Bit parsers for the Sensor.
# =============================================================================

# Wazuh writes newline-delimited JSON to alerts.json and archives.json.
[PARSER]
    Name         wazuh_json
    Format       json
    Time_Key     timestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep    On
